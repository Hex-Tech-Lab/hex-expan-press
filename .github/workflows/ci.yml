# Offline gates on every PR/push: lint, typecheck (root + web), unit tests. No secrets; ledger/integration tests never touch live services here.
name: ci
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm --dir web run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm --dir web exec tsc --noEmit
      - run: pnpm test
      # Latency summarizer tests use node:test, not vitest (vitest.config.ts globs only .ts).
      # A file with no test() calls still exits 0, so require at least 22 passing tests and none failing.
      - name: Latency summarizer tests (at least 22 passing)
        run: |
          min=22
          tap="$RUNNER_TEMP/summarizer-tap.txt"
          status=0
          node --test --test-reporter=tap scripts/latency/summarize-browsertime.test.mjs > "$tap" || status=$?
          cat "$tap"
          pass=$(sed -n 's/^# pass \([0-9]*\)$/\1/p' "$tap" | tail -n1)
          fail=$(sed -n 's/^# fail \([0-9]*\)$/\1/p' "$tap" | tail -n1)
          echo "summarizer tests: pass=${pass:-none} fail=${fail:-none} exit=$status (minimum $min)"
          if [ "$status" -ne 0 ] || [ "${fail:-1}" != "0" ] || [ "${pass:-0}" -lt "$min" ]; then
            echo "::error::latency summarizer test gate failed"
            exit 1
          fi
      - run: pnpm --dir web run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
