# Server-side copy of scripts/commit_guard.py (blind-spot audit 2026-09-25, risk 4): the local
# pre-commit hook can be skipped with --no-verify and does not travel with clones. This runs the
# deterministic rules (keys, .env, forbidden paths) on every push/PR. No Jev, no secrets needed.
# Hardened 2026-10-01 (gha-security-review): read-only token, SHA-pinned action, no credential
# persistence, event data passed via env (never interpolated into the script), and PRs are
# checked with the BASE branch's guard so a PR cannot weaken the rules that judge it.
name: commit-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Deterministic commit guard, every commit in the push / PR
        # Per commit, not the net diff: a key added in one commit and deleted in the next is still public.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="$PR_BASE_SHA..$HEAD_SHA"
            GUARD_REF="$PR_BASE_SHA"
          else
            GUARD_REF="$HEAD_SHA"
            if git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              RANGE="$BEFORE_SHA..$HEAD_SHA"
            elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ] && git rev-parse --verify -q "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
              # New branch or force-push: every commit not already on the default branch. Commits already on
              # the default branch are not re-checked here; this job checks what each push adds. (Do not exclude
              # the pushed branch's own remote ref: in actions/checkout it points at HEAD, so that range is empty
              # and checks nothing.)
              RANGE="$HEAD_SHA --not refs/remotes/origin/$DEFAULT_BRANCH"
            else
              # Default branch with no usable 'before', or no default ref to compare with: check the full
              # history reachable from HEAD. Fails closed.
              RANGE="$HEAD_SHA"
            fi
          fi
          # The guard and its imports (scripts/jev.py) come from GUARD_REF, never the PR head.
          mkdir -p "$RUNNER_TEMP/guard" && git archive "$GUARD_REF" scripts | tar -x -C "$RUNNER_TEMP/guard"
          # Capture the list first: a failing rev-list must fail the job, not silently check zero commits.
          # RANGE is intentionally word-split (it can hold two revisions and an option).
          # shellcheck disable=SC2086
          commits="$(git rev-list $RANGE)" || { echo "::error::git rev-list failed for range: $RANGE"; exit 1; }
          fail=0
          n=0
          while read -r c; do
            [ -n "$c" ] || continue
            n=$((n+1))
            git show --format= "$c" > guard.diff
            python3 "$RUNNER_TEMP/guard/scripts/commit_guard.py" --diff-file guard.diff --no-jev || { echo "::error::commit $c"; fail=1; }
          done <<< "$commits"
          echo "commit guard: checked $n commit(s), range: $RANGE"
          exit $fail
