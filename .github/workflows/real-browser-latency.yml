name: real-browser-latency

# Measures the buyer-facing pages with a real Chrome on a GitHub-hosted runner,
# then sends a signed summary per page to the latency probe.
# Scheduled runs only fire from the default branch. Use workflow_dispatch to test a branch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-browser-latency
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Browsertime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bt"
          npm install --prefix "$RUNNER_TEMP/bt" --no-save --no-audit --no-fund browsertime@28.4.0
          # --version prints a wrong number in 28.x, so read the installed package version instead.
          installed=$(node -p "require('$RUNNER_TEMP/bt/node_modules/browsertime/package.json').version")
          if [ "$installed" != "28.4.0" ]; then
            echo "::error::browsertime $installed installed, expected 28.4.0"
            exit 1
          fi

      - name: Record runner location (country only)
        run: |
          set -euo pipefail
          # Country only. The IP itself is never written to logs or to the summary.
          country=$(curl -fsS --max-time 20 https://ipinfo.io/json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=(JSON.parse(s).country||"").toLowerCase();process.stdout.write(c)})')
          if ! [[ "$country" =~ ^[a-z]{2}$ ]]; then
            echo "::error::could not determine runner country"
            exit 1
          fi
          echo "LATENCY_LOCATION=gha-$country" >> "$GITHUB_ENV"
          echo "runner location: gha-$country"

      - name: Chrome diagnostics
        run: |
          # Shows whether Chrome and ChromeDriver start on the runner at all, outside Browsertime.
          set +e
          google-chrome --version
          chromedriver --version
          timeout 30 google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --dump-dom about:blank > /dev/null 2> "$RUNNER_TEMP/chrome-direct.err"
          echo "direct headless launch exit=$?"
          head -c 1500 "$RUNNER_TEMP/chrome-direct.err"
          exit 0

      - name: Measure pages in Chrome (5 runs each)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bt/node_modules/.bin/browsertime" \
            https://expanpress.com/ \
            https://expanpress.com/books/retirearly500k \
            https://expanpress.com/books/retirearly500k/500k-playbook \
            -n 5 \
            --chrome.headless \
            --chrome.args=--no-sandbox \
            --chrome.args=--disable-dev-shm-usage \
            --chrome.enableVerboseChromeDriverLog \
            --resultDir "$RUNNER_TEMP/bt-results"

      - name: Summarise per page
        run: |
          set -euo pipefail
          node scripts/latency/summarize-browsertime.mjs \
            "$RUNNER_TEMP/bt-results/browsertime.json" "$RUNNER_TEMP/summaries"

      - name: Send signed summaries to the probe
        env:
          PROBE_INGEST_SECRET: ${{ secrets.PROBE_INGEST_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "$PROBE_INGEST_SECRET" ]; then
            echo "::error::PROBE_INGEST_SECRET is not set"
            exit 1
          fi
          failed=0
          for f in "$RUNNER_TEMP"/summaries/*.json; do
            sig=$(openssl dgst -sha256 -hmac "$PROBE_INGEST_SECRET" -hex < "$f" | awk '{print $NF}')
            code=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' --max-time 30 \
              -X POST https://expan-latency-probe.vercel.app/api/ingest \
              -H 'content-type: application/json' \
              -H "x-probe-signature: sha256=$sig" \
              --data-binary "@$f")
            echo "$(basename "$f"): HTTP $code"
            if [ "$code" != "202" ]; then
              failed=1
              # Probe error bodies are short and contain no secrets, so they are safe to print.
              head -c 300 "$RUNNER_TEMP/resp.json"; echo
            fi
          done
          exit $failed

      - name: Keep raw Browsertime output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browsertime-${{ github.run_id }}
          path: ${{ runner.temp }}/bt-results
          retention-days: 7
