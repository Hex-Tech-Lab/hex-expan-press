# Lint gates for every PR and every push to master: actionlint and shellcheck on the workflow files,
# gitleaks on the new commits, and ruff on the Python files the change touches.
#
# Trust model: this runs on pull_request_target, so GitHub reads THIS file from the BASE branch. A PR cannot
# edit, skip or weaken these checks. The PR's code is checked out only to be READ: no step runs a script,
# package manager or binary from the PR. Every tool comes from a pinned install made by this file, and each
# tool runs from a runner directory outside the checkout, so no PR-controlled config file is loaded.
#
# Bootstrap: this file takes effect on PRs only after it is on master. Until then the first PR that adds it
# has no run of this workflow, so its head is verified by hand before the merge. After the merge, the three
# job names are added as required status checks on master.
#
# ruff checks the whole of each changed .py file, so older violations in a file this PR touches can still
# fail the job. Files this PR does not touch are not linted.
name: lint-ci
on:
  pull_request_target:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head for reading only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          persist-credentials: false

      - name: Install actionlint v1.7.7 and shellcheck 0.10.0
        env:
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 shellcheck-v0.10.0/shellcheck
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"

      - name: Run actionlint on the PR's workflow files
        run: |
          set -euo pipefail
          # Copy the workflow files out of the checkout. A PR can add a .shellcheckrc or actionlint config next to
          # its files, and those would be read from the checkout's directories. Copies outside it are never read that way.
          # -type f skips symlinks, so a link cannot pull in a file from elsewhere on the runner.
          SRC="$GITHUB_WORKSPACE/pr/.github/workflows"
          DST="$RUNNER_TEMP/wf"
          mkdir -p "$DST"
          mapfile -d '' -t WF < <(find "$SRC" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          [ "${#WF[@]}" -gt 0 ] || { echo "::error::no workflow files found"; exit 1; }
          COPIES=()
          for f in "${WF[@]}"; do
            cp -- "$f" "$DST/$(basename "$f")"
            COPIES+=("$DST/$(basename "$f")")
          done
          # Run from the runner temp directory, not the checkout.
          cd "$RUNNER_TEMP"
          # Both extensions: GitHub accepts .yaml too.
          actionlint -shellcheck=shellcheck "${COPIES[@]}"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head with history, for reading only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.24.2
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan new commits for secrets
        # Event data goes through env, never interpolated into the script.
        # The config comes from the base branch's tip, fetched here, never from the PR checkout.
        # Config discovery is off (--config is set). gitleaks also loads ./.gitleaksignore from the working
        # directory, so the scan runs from the runner temp directory, not the checkout.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PR="$GITHUB_WORKSPACE/pr"
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git -C "$PR" fetch --no-tags -q origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            TRUST_REF="origin/${BASE_REF}"
            LOG_OPTS="origin/${BASE_REF}..${HEAD_SHA}"
          elif git -C "$PR" cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            TRUST_REF="$BEFORE_SHA"
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          else
            # New branch or force-push with no usable 'before'. Scan the full history reachable from HEAD (fails closed).
            # Default rules, no trust ref.
            TRUST_REF=""
            LOG_OPTS="${HEAD_SHA}"
          fi

          CONFIG="${RUNNER_TEMP}/gitleaks-trusted.toml"
          IGNORE="${RUNNER_TEMP}/gitleaks-empty.ignore"
          : > "$IGNORE"
          if [ -n "$TRUST_REF" ] && git -C "$PR" cat-file -e "${TRUST_REF}:.github/security/gitleaks.toml" 2>/dev/null; then
            git -C "$PR" show "${TRUST_REF}:.github/security/gitleaks.toml" > "$CONFIG"
            [ -s "$CONFIG" ] || { echo "::error::trusted gitleaks config is empty"; exit 1; }
            echo "gitleaks config: .github/security/gitleaks.toml from ${TRUST_REF}"
          else
            printf '[extend]\nuseDefault = true\n' > "$CONFIG"
            echo "gitleaks config: default rules (no trusted config on ${TRUST_REF:-no trust ref})"
          fi

          echo "gitleaks log range: ${LOG_OPTS}"
          cd "$RUNNER_TEMP"
          gitleaks git --redact --no-banner \
            --config "$CONFIG" \
            --gitleaks-ignore-path "$IGNORE" \
            --ignore-gitleaks-allow \
            --log-opts="${LOG_OPTS}" "$PR"

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head with history, for reading only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff 0.8.6
        run: |
          set -euo pipefail
          printf '%s\n' 'ruff==0.8.6 --hash=sha256:7ae4478b1471fc0c44ed52a6fb787e641a2ac58b1c1f91763bafbc2faddc5117' > "$RUNNER_TEMP/ruff-req.txt"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/ruff-req.txt"

      - name: Lint Python files changed by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PR="$GITHUB_WORKSPACE/pr"
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            git -C "$PR" fetch --no-tags -q origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            BASE="origin/${BASE_REF}"
          elif git -C "$PR" cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            echo "::error::no usable before SHA; cannot bound the Python lint range"
            exit 1
          fi
          # Diff from the merge-base, so files that only the base branch changed are not linted.
          MERGE_BASE="$(git -C "$PR" merge-base "$BASE" "$HEAD_SHA" 2>/dev/null)" || { echo "::error::no merge base"; exit 1; }
          CHANGED_LIST="$RUNNER_TEMP/changed.z"
          git -C "$PR" diff -z --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" -- '*.py' > "$CHANGED_LIST"
          mapfile -d '' -t FILES < "$CHANGED_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed against ${BASE}; ruff skipped."
            exit 0
          fi
          # Copy the changed files out of the checkout and lint the copies from the runner temp directory.
          # --isolated ignores every config file, and --ignore-noqa ignores inline "# noqa" comments.
          # python -I ignores the current directory on sys.path, so a PR-added ruff/ directory cannot shadow the tool.
          OUT="$RUNNER_TEMP/py"
          rm -rf "$OUT"
          for f in "${FILES[@]}"; do
            mkdir -p "$OUT/$(dirname "$f")"
            # Read the blob from git, never the working tree: cat-file does not follow a symlink, so a PR-added
            # link to a runner file cannot pull that file into the lint input.
            git -C "$PR" cat-file blob "${HEAD_SHA}:${f}" > "$OUT/$f"
          done
          echo "Linting ${#FILES[@]} changed Python file(s)."
          cd "$OUT"
          python -I -m ruff check --isolated --ignore-noqa --no-cache -- "${FILES[@]}"
