# Lint gates on every PR and on push to master. actionlint + shellcheck check the workflow files,
# gitleaks checks the new commits for secrets (values redacted), and ruff checks only the Python
# files this change touches (the older scripts/ tree has existing findings this change does not own).
# Every check fails the run on a finding. No continue-on-error anywhere.
#
# Limits, stated so this gate is not read as more than it is:
# - Secrets already in history are not covered. The gitleaks job scans only the commits in the PR or
#   push range. The history audit is tracked separately.
# - This workflow file is PR-controlled for the PR that adds it, so a PR can change these checks.
#   The fix is a base-controlled workflow on pull_request_target that runs no PR code, plus a required
#   branch-protection check. That is a follow-up. This file becomes trusted only after it lands on master.
# - ruff checks the whole of each changed .py file, so older violations in a file this PR touches can
#   still fail the job. Files this PR does not touch are not linted.
name: lint-ci
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint v1.7.7 and shellcheck 0.10.0
        env:
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 shellcheck-v0.10.0/shellcheck
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"

      - name: Run actionlint on workflow files
        run: actionlint -shellcheck=shellcheck .github/workflows/*.yml

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks v8.24.2
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan new commits for secrets
        # Event data goes through env, never interpolated into the script.
        # The config comes from the trust ref, never from this checkout. The trust ref is the base
        # commit for a PR and the previous tip for a push. Config discovery is off (--config is set),
        # so a PR's .gitleaks.toml has no effect. A PR's .gitleaksignore has no effect (its path is
        # replaced by an empty file). Inline gitleaks:allow comments are ignored.
        # Limit: this step is PR-controlled for the PR that adds it. See the header.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          TRUST_REF=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git rev-parse --verify -q "origin/${BASE_REF}" >/dev/null \
              || { echo "::error::origin/${BASE_REF} is missing; cannot read the trusted config"; exit 1; }
            TRUST_REF="origin/${BASE_REF}"
            LOG_OPTS="origin/${BASE_REF}..HEAD"
          elif git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            TRUST_REF="$BEFORE_SHA"
            LOG_OPTS="${BEFORE_SHA}..HEAD"
          else
            # New branch or force-push with no usable 'before'. Do not use "HEAD --not --remotes=origin":
            # in this checkout origin/<branch> already points at HEAD, so that range is empty and scans nothing.
            # Scan the full history reachable from HEAD instead (fails closed). No trust ref, so default rules.
            LOG_OPTS="HEAD"
          fi

          CONFIG="${RUNNER_TEMP}/gitleaks-trusted.toml"
          IGNORE="${RUNNER_TEMP}/gitleaks-empty.ignore"
          : > "$IGNORE"
          if [ -n "$TRUST_REF" ] && git cat-file -e "${TRUST_REF}:.github/security/gitleaks.toml" 2>/dev/null; then
            # Present on the trust ref: read it from there. A failed read stops the job (set -e). No fallback.
            git show "${TRUST_REF}:.github/security/gitleaks.toml" > "$CONFIG"
            [ -s "$CONFIG" ] || { echo "::error::trusted gitleaks config is empty"; exit 1; }
            echo "gitleaks config: .github/security/gitleaks.toml from ${TRUST_REF}"
          else
            # Not on the trust ref: gitleaks default rules. --config below still turns discovery off.
            printf '[extend]\nuseDefault = true\n' > "$CONFIG"
            echo "gitleaks config: default rules (no trusted config on ${TRUST_REF:-no trust ref})"
          fi

          echo "gitleaks log range: ${LOG_OPTS}"
          gitleaks git --redact --no-banner \
            --config "$CONFIG" \
            --gitleaks-ignore-path "$IGNORE" \
            --ignore-gitleaks-allow \
            --log-opts="${LOG_OPTS}" .

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff 0.8.6
        run: python -m pip install --disable-pip-version-check ruff==0.8.6

      - name: Lint Python files changed by this change
        # Only the .py files this change adds or modifies, not the whole scripts/ tree.
        # ruff checks the whole of each changed file, so older violations in a file this PR touches can
        # still fail the job. Files this PR does not touch are not linted.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          elif git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            # No usable 'before' (new branch or force-push): judge the head commit's own changes against its parent.
            # A root commit has no parent, so the empty tree is the base and every .py file it adds is judged.
            BASE="$(git rev-parse --verify -q HEAD~1 || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)"
          fi
          # Write the list to a file first so a failing git diff stops the job instead of skipping ruff.
          # Diff from the merge-base, so files that only the base branch changed are not linted.
          # The root-commit base is the empty tree, which has no merge-base with HEAD: use the base itself.
          MERGE_BASE="$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")"
          CHANGED_LIST="$(mktemp)"
          git diff -z --name-only --diff-filter=ACMR "$MERGE_BASE" HEAD -- '*.py' > "$CHANGED_LIST"
          mapfile -d '' -t FILES < "$CHANGED_LIST"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed against ${BASE}; ruff skipped."
            exit 0
          fi
          echo "Linting ${#FILES[@]} changed Python file(s)."
          python -m ruff check -- "${FILES[@]}"
