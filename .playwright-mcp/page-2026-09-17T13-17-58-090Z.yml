            - generic [ref=f9e250]:
              - heading "Wyoming LLC naming requirements" [level=2] [ref=f9e251]
              - generic [ref=f9e252]:
                - paragraph [ref=f9e253]: "Naming a Wyoming LLC comes down to 3 requirements: your name must include an LLC designator, it must be distinguishable from every other business name on file with the Wyoming Secretary of State, and it can't use words that misidentify your entity type. Get those right, and you're ready to file."
                - heading "Wyoming LLC naming requirements" [level=3] [ref=f9e254]
                - paragraph [ref=f9e255]: "Wyoming law (Wyo. Stat. § 17-29-108) sets out the naming rules every LLC must follow. The name has to include a term or abbreviation that signals limited liability company status. Acceptable designators are: \"limited liability company,\" \"limited company,\" \"LLC,\" \"L.L.C.,\" \"LC,\" or \"L.C.\" You can't use corporate designators like \"Inc.\" or \"Corp.\" — those misidentify the entity type and the Wyoming Secretary of State will reject the filing."
                - paragraph [ref=f9e256]: "Beyond the designator, your name must be distinguishable from every other business entity already registered in Wyoming. The state's distinguishability rules are stricter than people expect: swapping \"LLC\" for \"Inc.,\" adding punctuation, or inserting words like \"The\" or \"And\" does not make a name distinguishable. The core words have to be different."
                - list [ref=f9e257]:
                  - listitem [ref=f9e258]:
                    - paragraph [ref=f9e259]: Name must include "limited liability company," "limited company," "LLC," "L.L.C.," "LC," or "L.C."
                  - listitem [ref=f9e260]:
                    - paragraph [ref=f9e261]: Name must be distinguishable from all other registered Wyoming business entities
                  - listitem [ref=f9e262]:
                    - paragraph [ref=f9e263]: Differences only in entity designators (LLC vs. Inc.), punctuation, spacing, or words like "The" or "And" do not create a distinguishable name
                  - listitem [ref=f9e264]:
                    - paragraph [ref=f9e265]: Name cannot use corporate designators like "Inc.," "Corp.," or "Co." for an LLC
                  - listitem [ref=f9e266]:
                    - paragraph [ref=f9e267]: Name cannot contain words that imply a different type of entity or a government affiliation without approval
                - heading "How to search for a Wyoming LLC name" [level=3] [ref=f9e268]
                - paragraph [ref=f9e269]:
                  - text: Check name availability using the Wyoming Secretary of State's
                  - link "Business Entity Search" [ref=f9e270] [cursor=pointer]:
                    - /url: /llc/wyoming/business-names
                  - text: at wyobiz.wyo.gov. Search before you file — if another business already has your name (or something close to it), the state will reject your Articles of Organization.
                - paragraph [ref=f9e271]: For the most accurate results, search the core words of your name without the LLC designator. Use the "Contains" filter to catch similar names, not just exact matches. A name like "Teton Peak Consulting LLC" could conflict with "Teton Peak Consulting Inc." — the designator difference doesn't matter under Wyoming's rules.
                - paragraph [ref=f9e272]:
                  - text: A clear search result from the state database doesn't guarantee trademark protection. Run a separate search on the
                  - link "USPTO database" [ref=f9e273] [cursor=pointer]:
                    - /url: /llc/wyoming/business-names
                  - text: to check whether your name conflicts with a federally registered trademark before you commit to it.
                - heading "How to reserve a Wyoming LLC name" [level=3] [ref=f9e274]
                - paragraph [ref=f9e275]: Name reservation is optional in Wyoming, but it's worth doing if you've found the right name and aren't ready to file your Articles of Organization yet. Reserving the name holds it while you get everything else in order.
                - paragraph [ref=f9e276]:
                  - text: To
                  - link "reserve a name" [ref=f9e277] [cursor=pointer]:
                    - /url: /llc/wyoming/business-names
                  - text: ", complete the \"Limited Liability Company Application for Reservation of Name\" form and mail it to the Wyoming Secretary of State at Herschler Building East, Suite 101, 122 W 25th Street, Cheyenne, WY 82002-0020. The filing fee is $60, payable by check or money order. Processing takes up to 15 business days after the state receives your application."
                - heading "Wyoming trade names (DBA)" [level=3] [ref=f9e278]
                - paragraph [ref=f9e279]:
                  - text: Wyoming calls a DBA a "
                  - link "trade name" [ref=f9e280] [cursor=pointer]:
                    - /url: /llc/wyoming/business-names
                  - text: ." If you want to run your business under a name that's different from your LLC's legal name — for a product line, a local brand, or a different market — you can register a trade name with the Wyoming Secretary of State.
                - paragraph [ref=f9e281]: "A trade name doesn't create a separate legal entity. Your LLC remains the legal owner of the business. The trade name is just the name you use publicly. You'll still need to meet all the same naming rules: the trade name must be distinguishable from other registered names in Wyoming."
                - heading "How to register your Wyoming LLC name" [level=3] [ref=f9e282]
                - paragraph [ref=f9e283]: Your LLC name is registered when you file your Articles of Organization with the Wyoming Secretary of State. There's no separate name registration step — the name you list on the Articles becomes your official registered name the moment the state approves the filing.
                - paragraph [ref=f9e284]: Write the full legal name exactly as you want it to appear in the public registry — including the LLC designator, correct spelling, punctuation, and spacing. The name on your Articles must match the name you confirmed as available in the state's business search. Any discrepancy can delay or reject your filing.
                - list [ref=f9e285]:
                  - listitem [ref=f9e286]:
                    - paragraph [ref=f9e287]: Confirm name availability at wyobiz.wyo.gov before filing
                  - listitem [ref=f9e288]:
                    - paragraph [ref=f9e289]: Include a valid LLC designator (LLC, L.L.C., LC, L.C., "limited liability company," or "limited company")
                  - listitem [ref=f9e290]:
                    - paragraph [ref=f9e291]: Write the name exactly as it should appear in the public registry
                  - listitem [ref=f9e292]:
                    - paragraph [ref=f9e293]: File Articles of Organization with the Wyoming Secretary of State — online filing fee is $100
                  - listitem [ref=f9e294]:
                    - paragraph [ref=f9e295]: Optionally reserve the name first for $60 if you need more time before filing
