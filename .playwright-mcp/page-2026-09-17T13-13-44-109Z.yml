            - heading "About Our Office" [level=2] [ref=e145]
            - paragraph [ref=e146]: We have a long history of serving the public. Beginning in April 1869 with the appointment of the first Secretary of the Territory of Wyoming, Edward M. Lee, by United States President Ulysses S. Grant, this office has always served the public from the State Capitol Building. However, following the completion of the Capitol Renovation Project in 2019, the Office is now located at Herschler Building East, Suites 100 and 101.
