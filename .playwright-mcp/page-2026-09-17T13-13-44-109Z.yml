                - generic [ref=e124]: The statement that a company is in "good standing" simply notifies the public that all paperwork or fees required to form or maintain registration has been filed with the Secretary of State and is current. "Good Standing" in no way implies endorsement of the business nor does it reflect on the quality of the products or services provided by the business.
