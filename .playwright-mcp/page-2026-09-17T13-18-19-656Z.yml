            - paragraph [ref=f14e77]: Wyoming corporations are required to use corporate name endings, such as the word "Incorporated" or the abbreviation "Inc." The corporate name may not contain language implying a different purpose from the purpose or purposes in the Articles of Incorporation. The name shall not be the same as or similar to the name of any domestic or foreign for-profit or nonprofit corporation, trade name, trademark or service mark registered in this state, limited liability company, statutory trust company, limited partnership or other business entity.
